name: Risk v2 signed check-in contract attestation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact published source ref
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit
        required: true
        type: string
      source_tree_sha:
        description: Exact 40-character source tree
        required: true
        type: string
      enrollment_id:
        description: Exact live enrollment identifier
        required: true
        type: string
      secret_name:
        description: Exact enrollment-versioned repository secret
        required: true
        type: string
      attestation_input_base64:
        description: Canonical closed attestation template JSON
        required: true
        type: string
      artifact_name:
        description: Unique sanitized Actions artifact name
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed before repository-secret use
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE_SHA: ${{ inputs.source_tree_sha }}
          ENROLLMENT_ID: ${{ inputs.enrollment_id }}
          SECRET_NAME: ${{ inputs.secret_name }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$CURRENT_REF" == "refs/heads/main" ]]
          [[ "$WORKFLOW_REF" == "auroraverse-ops/aurora-check-in/.github/workflows/risk-v2-checkin-contract-attestation.yml@refs/heads/main" ]]
          [[ "$SOURCE_REF" =~ ^refs/heads/[A-Za-z0-9][A-Za-z0-9._/-]{0,198}$ && "$SOURCE_REF" != *..* && "$SOURCE_REF" != *//* ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$SOURCE_TREE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ENROLLMENT_ID" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SECRET_NAME" == "RISK_V2_ED25519_PRIVATE_KEY_PKCS8_BASE64_${ENROLLMENT_ID^^}" ]]
          [[ "$ARTIFACT_NAME" =~ ^risk-v2-checkin-contract-[a-z0-9-]{3,80}$ ]]

      - name: Checkout exact signer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: signer
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout and bind exact evidence source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source ref, commit and tree
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE_SHA: ${{ inputs.source_tree_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${SOURCE_REF#refs/}" --jq .object.sha)" = "$SOURCE_SHA"

      - name: Sign closed check-in contract attestation
        shell: bash
        env:
          RISK_V2_SIGNER_CONFIG_BASE64: 
          RISK_V2_CHECKIN_CONTRACT_INPUT_BASE64: ${{ inputs.attestation_input_base64 }}
          RISK_V2_ED25519_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets[inputs.secret_name] }}
          RISK_V2_OUTPUT_DIR: ${{ runner.temp }}/risk-v2-checkin-contract
          RISK_V2_VERIFIED_SOURCE_SHA: ${{ inputs.source_sha }}
          RISK_V2_VERIFIED_SOURCE_TREE_SHA: ${{ inputs.source_tree_sha }}
        run: node signer/tools/sign-checkin-release-contract-attestation.mjs

      - name: Upload exact signed attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/risk-v2-checkin-contract
          if-no-files-found: error
          retention-days: 7
