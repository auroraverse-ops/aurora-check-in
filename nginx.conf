server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # ---------------------------------------------------------------------------
    # Security Headers
    #
    # ACHTUNG - nginx-Falle: add_header wird NICHT in eine location vererbt, die
    # ein EIGENES add_header setzt. Dort fallen dann ALLE serverweiten Header weg.
    # Genau das war die Ursache des Befundes B-02 (Sicherheitsanalyse 2026-07-26):
    # "location = /index.html" setzte nur Cache-Control, wodurch auf der Root-Route
    # (SPA-Fallback -> index.html) saemtliche Sicherheits-Header verschwanden.
    # Die Seite lieferte extern KEINEN einzigen Header, obwohl hier drei standen.
    #
    # Deshalb: jede location mit eigenem add_header wiederholt das Set VOLLSTAENDIG.
    # Gleiches Muster wie in apps/admin und apps/portal (aurora-v2).
    # Bei Aenderungen IMMER alle drei Bloecke gleich halten.
    # ---------------------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Bewusst enger als bei Admin/Portal: Check-in nutzt KEINE Kamera in der Web-App
    # (der QR-Scan passiert in der Tablet-Kamera-App, die dann die URL oeffnet -
    # kein getUserMedia/BarcodeDetector im Code, geprueft 2026-07-26).
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # frame-ancestors 'none': Check-in wird nirgends per iframe eingebettet
    # (kein <iframe src="checkin..."> im Aurora-Code; das Tablet oeffnet die URL
    # direkt per QR-Code/Lesezeichen - geprueft 2026-07-26).
    # connect-src deckt beide realen Datenpfade ab: (1) Supabase Edge Functions
    # checkin-config/checkin-submit (Test + Prod), (2) AKZ-Legacy-Direktwebhook
    # ueber VITE_N8N_WEBHOOK_URL fuer Alt-Standorte.
    # fonts.googleapis.com/fonts.gstatic.com: die Schrift "Outfit" wird in
    # src/index.css per @import zur Laufzeit von Google geladen. Ohne diese
    # Eintraege wuerde die Schrift blockiert und die Tablets zeigten eine
    # Ersatzschrift. Sauberer waere die bereits installierte Abhaengigkeit
    # @fontsource/outfit lokal einzubinden - dann koennen beide Google-Domains
    # hier entfernt werden (offener Punkt, auch datenschutzrelevant).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://supabase-test.askitech.de https://supabase-aurora.auroraverse.de; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://supabase-test.askitech.de https://supabase-aurora.auroraverse.de https://neightn.akz-gruppe.de https://n8n.akz-leutkirch.de https://n8n.akz-lindau.de https://n8n.akz-wangen.de; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:" always;

    # Cache static assets (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Header-Set wiederholt - siehe Hinweis oben
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://supabase-test.askitech.de https://supabase-aurora.auroraverse.de; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://supabase-test.askitech.de https://supabase-aurora.auroraverse.de https://neightn.akz-gruppe.de https://n8n.akz-leutkirch.de https://n8n.akz-lindau.de https://n8n.akz-wangen.de; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:" always;
        try_files $uri =404;
    }

    # SPA fallback - CRITICAL for client-side routing
    # All routes (e.g., /privacy) will be served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html to always get latest version
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        # Header-Set wiederholt - DIES war die Fehlerstelle von B-02, siehe Hinweis oben
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://supabase-test.askitech.de https://supabase-aurora.auroraverse.de; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://supabase-test.askitech.de https://supabase-aurora.auroraverse.de https://neightn.akz-gruppe.de https://n8n.akz-leutkirch.de https://n8n.akz-lindau.de https://n8n.akz-wangen.de; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:" always;
    }

    # Health check endpoint for Coolify
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
